name: Database payment-intent tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-intents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merchantpay
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: merchantpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchantpay -d merchantpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    env:
      MERCHANTPAY_TEST_DSN: postgresql://merchantpay:local-test-only@localhost:5432/merchantpay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests/test_payment_intents_db.py
